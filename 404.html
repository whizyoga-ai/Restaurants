<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Page removed</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           color: #1d1d1f; background: #fafaf8; }
    main { max-width: 34rem; padding: 2rem 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { margin: 0 0 .75rem; }
    a { color: #0a5c36; }
  </style>
</head>
<body>
<main>
  <h1>This page has been removed.</h1>
  <p>The website that used to be at this address was a demonstration. It has been taken down and will not return.</p>
  <p id="restaurant" hidden>It was not the restaurant's own website. Leaf &amp; Loaf's website is
    <a href="https://leafandloaf.is/" rel="nofollow noopener">leafandloaf.is</a>.</p>
</main>
<script>
  // Only visitors who arrived on an old restaurant URL get the pointer.
  if (/\/restaurants\/leaf-and-loaf/.test(location.pathname)) {
    document.getElementById('restaurant').hidden = false;
  }
</script>
</body>
</html>
